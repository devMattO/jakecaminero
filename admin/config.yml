# Decap CMS config for jake-site.
# backend: DecapBridge (decapbridge.com), PKCE auth — generated from the
# DecapBridge dashboard for this site, not hand-typed.
#
# Images use Decap's plain built-in git-based image widget — uploaded
# photos get committed straight into content/media/<project-id>/ (a
# separate directory from assets-src/, which stays local-only for bulk
# imports; see docs/IMAGES.md). No external media host: after trying
# Cloudinary's Media Library first and hitting its gated Assets/DAM
# product plus an unrelated console error, git-based storage is the
# simpler, more reliable choice — the tradeoff (repo grows with every
# photo, no cleanup path later) is accepted deliberately. See CLAUDE.md.

backend:
  name: git-gateway
  repo: devMattO/jakecaminero
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/25620201-14e0-4722-b57f-eb4fea945685/pkce
  auth_token_endpoint: /sites/25620201-14e0-4722-b57f-eb4fea945685/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://jakecaminero.com

# Fallback only — every image field below sets its own media_folder/
# public_folder (scoped per project via {{slug}}), so this path in
# practice never gets used.
media_folder: "static/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    extension: json
    format: json
    slug: "{{fields.id}}"
    identifier_field: id
    summary: "{{order}} — {{t}} ({{client}})"
    sortable_fields: [order, t, yr]
    fields:
      - label: "Project ID"
        name: id
        widget: string
        pattern: ["^[a-z0-9-]+$", "lowercase letters, numbers, hyphens only"]
        hint: "Never change this after the project is created — it's also the image folder name."
      - label: "Display order"
        name: order
        widget: number
        hint: "Lower numbers show first on the homepage and Work page. Newest work should have the lowest number."
      - {label: Title, name: t, widget: string}
      - {label: Client, name: client, widget: string}
      - {label: "Date (as displayed)", name: date, widget: string, hint: 'e.g. "March 18, 2026" or "2025 — 2026"'}
      - {label: Year, name: yr, widget: string, pattern: ["^[0-9]{4}$", "4-digit year"]}
      - label: Roles
        name: roles
        widget: select
        multiple: true
        min: 1
        options:
          - {label: "Creative Direction", value: cd}
          - {label: Stills, value: stills}
          - {label: Motion, value: motion}
      - {label: "Selected Work", name: selected, widget: boolean, default: false, hint: "On = shows on the homepage and Work page. Off = Archive only."}
      - {label: Location, name: loc, widget: string, required: false}
      - {label: Deliverables, name: del, widget: list, required: false}
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - Photography
          - Cinematography
          - Creative Direction
          - Documentary
          - Campaign
          - Editorial
          - Brand Film
          - Automotive
          - Cycling
          - Fashion
          - Food & Drink
          - Hospitality
          - Outdoor
          - Sport
          - Wellness
      - {label: Description, name: desc, widget: text}
      - label: Credits
        name: credits
        widget: list
        required: false
        summary: "{{fields.r}} — {{fields.n}}"
        fields:
          - {label: Role, name: r, widget: string}
          - {label: Name, name: n, widget: string}
      - {label: "Video URL (Vimeo)", name: video, widget: string, required: false}
      - label: Images
        name: images
        widget: object
        required: false
        fields:
          - label: "Main image"
            name: main
            widget: image
            choose_url: false
            media_folder: "/content/media/{{slug}}"
            public_folder: "/content/media/{{slug}}"
            hint: "The lead photo for this project."
          - label: "Social card image"
            name: og
            widget: image
            choose_url: false
            required: false
            media_folder: "/content/media/{{slug}}"
            public_folder: "/content/media/{{slug}}"
            hint: "Optional — falls back to the main image if left blank."
          - label: "Gallery images"
            name: gallery
            widget: list
            required: false
            summary: "{{fields.src}}"
            field:
              label: Image
              name: src
              widget: image
              choose_url: false
              media_folder: "/content/media/{{slug}}"
              public_folder: "/content/media/{{slug}}"

  - name: info
    label: "Site Info"
    files:
      - label: "Site Info"
        name: info
        file: content/info.json
        format: json
        fields:
          - {label: Intro, name: intro, widget: text, hint: "Homepage statement. Wrap a client name in {curly braces} to auto-link it to the Work page."}
          - label: "Homepage Hero Image"
            name: heroImage
            widget: image
            choose_url: false
            required: false
            media_folder: "/content/media/site"
            public_folder: "/content/media/site"
            hint: "Replaces the nested-frames animation at the top of the homepage with this photo. Leave blank to keep the animation."
          - label: "Homepage Hero Video (Vimeo)"
            name: heroVideo
            widget: string
            required: false
            hint: "If filled in, the homepage plays this as a looping, muted background video instead of a photo or the animation — same as a project's Video URL field. The Hero Image above (if also set) shows briefly while the video loads."
          - {label: Bio, name: bio, widget: text}
          - label: Portrait
            name: portrait
            widget: image
            choose_url: false
            required: false
            media_folder: "/content/media/site"
            public_folder: "/content/media/site"
          - {label: Emails, name: emails, widget: list}
          - label: Socials
            name: socials
            widget: list
            fields:
              - {label: Name, name: n, widget: string}
              - {label: URL, name: u, widget: string}
          - label: "Contact blocks"
            name: contact
            widget: list
            fields:
              - {label: Heading, name: h, widget: string}
              - {label: Lines, name: lines, widget: list}
          - label: Gear
            name: gear
            widget: list
            required: false
            fields:
              - {label: Heading, name: h, widget: string}
              - {label: Items, name: list, widget: list}
          - {label: Clients, name: clients, widget: list}
          - {label: Recognition, name: recognition, widget: list, required: false}
          - {label: Approach, name: approach, widget: text}
          - label: "Ongoing / Services"
            name: ongoing
            widget: list
            required: false
            fields:
              - {label: Title, name: t, widget: string}
              - {label: Description, name: d, widget: text}
