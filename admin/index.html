<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Jake Caminero — Content</title>
</head>
<body>
  <!-- DecapBridge needs Decap CMS >= 3.8.3 — pinned, not a loose range. -->
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>

  <!-- Custom "cloudinary-upload" widget — a plain unsigned upload straight to
       Cloudinary's REST API, not Cloudinary's Media Library/Assets widget
       (that product needs a separate sales-gated plan; this doesn't).
       cloud_name/upload_preset come from each field's config in config.yml,
       not hardcoded here. Stored value is just the resulting secure_url
       string — same shape prepare-images.mjs already expects. -->
  <script>
  var CloudinaryUploadControl = createClass({
    getInitialState: function () {
      return { uploading: false, error: null };
    },
    upload: function (file) {
      var field = this.props.field;
      var cloudName = field.get('cloud_name');
      var preset = field.get('upload_preset');
      if (!cloudName || !preset) {
        this.setState({ error: 'Missing cloud_name/upload_preset in config.yml for this field.' });
        return;
      }
      this.setState({ uploading: true, error: null });
      var body = new FormData();
      body.append('file', file);
      body.append('upload_preset', preset);
      fetch('https://api.cloudinary.com/v1_1/' + cloudName + '/image/upload', { method: 'POST', body: body })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (j) { throw new Error((j.error && j.error.message) || res.statusText); });
          return res.json();
        })
        .then(function (data) {
          this.setState({ uploading: false });
          this.props.onChange(data.secure_url);
        }.bind(this))
        .catch(function (err) {
          this.setState({ uploading: false, error: err.message || 'Upload failed.' });
        }.bind(this));
    },
    handleFileSelect: function (e) {
      var file = e.target.files && e.target.files[0];
      if (file) this.upload(file);
    },
    handleRemove: function () {
      this.props.onChange('');
    },
    render: function () {
      var value = this.props.value;
      return h('div', { className: this.props.classNameWrapper },
        h('input', {
          id: this.props.forID,
          type: 'file',
          accept: 'image/*',
          disabled: this.state.uploading,
          onChange: this.handleFileSelect
        }),
        this.state.uploading && h('p', {}, 'Uploading…'),
        this.state.error && h('p', { style: { color: '#c0392b' } }, this.state.error),
        value && !this.state.uploading && h('div', { style: { marginTop: '8px' } },
          h('img', { src: value, style: { maxWidth: '240px', display: 'block', marginBottom: '6px' } }),
          h('button', { type: 'button', onClick: this.handleRemove }, 'Remove image')
        )
      );
    }
  });

  var CloudinaryUploadPreview = createClass({
    render: function () {
      return this.props.value
        ? h('img', { src: this.props.value, style: { maxWidth: '100%' } })
        : h('p', {}, 'No image');
    }
  });

  CMS.registerWidget('cloudinary-upload', CloudinaryUploadControl, CloudinaryUploadPreview, {
    properties: { cloud_name: { type: 'string' }, upload_preset: { type: 'string' } }
  });
  </script>
</body>
</html>
